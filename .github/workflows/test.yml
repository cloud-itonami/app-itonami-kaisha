name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.12.0.1530
          bb: 1.12.218
      - run: bb test
      - run: clojure -M:test
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.12.0.1530
          bb: 1.12.218
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bb test-cljs
      - run: bb ui
      - run: node scripts/build.mjs
      - run: node --test shell/host.test.mjs
